<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>無音Webカメラ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      position: fixed;
    }
    .app-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      height: 100dvh;
    }
    .camera-container {
      flex: 1;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* iOSの自動再生制限時の起動画面 */
    .start-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 20px;
      text-align: center;
    }
    .start-btn {
      background: #007aff;
      color: #fff;
      border: none;
      padding: 16px 36px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      margin-top: 20px;
    }
    .controls {
      height: 110px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      z-index: 5;
    }
    .icon-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #fff;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
    }
    .shutter-btn {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      border: 4px solid #fff;
      background: transparent;
      padding: 4px;
      cursor: pointer;
    }
    .shutter-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.1s;
    }
    .shutter-btn:active .shutter-inner {
      transform: scale(0.85);
      background: #ccc;
    }
    canvas { display: none; }

    /* プレビューモーダル */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #000;
      flex-direction: column;
      z-index: 100;
    }
    .modal.active { display: flex; }
    .preview-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: hidden;
    }
    .preview-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 12px;
    }
    .modal-controls {
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      background: #111;
    }
    .btn {
      padding: 14px 28px;
      border-radius: 28px;
      border: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-cancel { background: #333; color: #fff; }
    .btn-save { background: #007aff; color: #fff; }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="camera-container">
      <video id="video" autoplay playsinline muted></video>

      <div class="start-overlay" id="start-overlay">
        <h2>無音カメラ</h2>
        <p style="margin-top:10px; color:#aaa; font-size:14px;">ボタンを押してカメラを起動してください</p>
        <button class="start-btn" id="start-btn">カメラ起動</button>
      </div>
    </div>

    <div class="controls">
      <button class="icon-btn" id="switch-btn">🔄</button>
      <button class="shutter-btn" id="shutter-btn" aria-label="撮影">
        <div class="shutter-inner"></div>
      </button>
      <div style="width: 48px;"></div>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <div class="modal" id="modal">
    <div class="preview-container">
      <img id="preview-img" alt="撮影写真">
    </div>
    <div class="modal-controls">
      <button class="btn btn-cancel" id="close-btn">再撮影</button>
      <button class="btn btn-save" id="save-btn">写真アプリに保存</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const shutterBtn = document.getElementById('shutter-btn');
    const switchBtn = document.getElementById('switch-btn');
    const startOverlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');
    const modal = document.getElementById('modal');
    const previewImg = document.getElementById('preview-img');
    const saveBtn = document.getElementById('save-btn');
    const closeBtn = document.getElementById('close-btn');

    let currentStream = null;
    let facingMode = 'environment';
    let capturedBlob = null;

    async function initCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      try {
        const constraints = {
          video: {
            facingMode: { ideal: facingMode },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        };
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        await video.play();
        startOverlay.style.display = 'none';
      } catch (err) {
        alert('カメラの起動に失敗しました: ' + err.message + '\nSafariの「Webサイトの権限」でカメラが許可されているかご確認ください。');
      }
    }

    startBtn.addEventListener('click', () => {
      initCamera();
    });

    // 既に許可済みの場合は自動起動を試みる
    window.addEventListener('DOMContentLoaded', () => {
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        initCamera();
      }
    });

    // 無音撮影処理
    shutterBtn.addEventListener('click', () => {
      if (!video.videoWidth) return;

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');

      if (facingMode === 'user') {
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
      }

      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      canvas.toBlob((blob) => {
        if (!blob) return;
        capturedBlob = blob;
        previewImg.src = URL.createObjectURL(blob);
        modal.classList.add('active');
      }, 'image/jpeg', 0.95);
    });

    // iPhoneの写真アプリへ保存（共有メニュー起動）
    saveBtn.addEventListener('click', async () => {
      if (!capturedBlob) return;
      const file = new File([capturedBlob], `photo_${Date.now()}.jpg`, { type: 'image/jpeg' });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file] });
          modal.classList.remove('active');
        } catch (err) {
          if (err.name !== 'AbortError') {
            alert('保存エラー: ' + err.message);
          }
        }
      } else {
        alert('長押しして「写真に追加」を選択してください。');
      }
    });

    closeBtn.addEventListener('click', () => {
      modal.classList.remove('active');
    });

    switchBtn.addEventListener('click', () => {
      facingMode = (facingMode === 'environment') ? 'user' : 'environment';
      initCamera();
    });
  </script>
</body>
</html>
